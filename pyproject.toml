[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "instructoravs"
version = "1.0.0"
description = "Generate, version and export IT help guides and CVs as Markdown, text, HTML, PDF and Word."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Soul Apps" }]
dependencies = []

[project.optional-dependencies]
web = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
instructoravs = "instructoravs.cli:main"

[tool.setuptools]
packages = ["instructoravs", "app", "app.routers"]

[tool.setuptools.package-data]
app = ["static/*"]
